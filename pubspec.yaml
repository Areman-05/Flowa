name: flowa
description: Flowa — premium fintech finance app for clarity, control, and confidence.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  equatable: ^2.0.7
  shared_preferences: ^2.5.5
  google_fonts: ^6.2.1
  flutter_lucide: ^1.37.0
  mobile_scanner: ^7.4.0
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/top_mist.frag

  assets:
    - assets/images/
    - assets/icons/

  # Custom fonts will be wired when brand assets are added.
