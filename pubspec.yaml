  #     fonts:
  #       - asset: assets/fonts/FlowaSans-Regular.ttf
  #       - asset: assets/fonts/FlowaSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/FlowaSans-Bold.ttf
  #         weight: 700
